name: Release

# `auto shipit` pushes a generated changelog commit to main, and the
# "main - publish gate" ruleset requires nine status checks that a
# brand-new commit cannot have, so a maintainer PAT is rejected with
# GH013. The cirron-release GitHub App is that ruleset's only bypass
# actor; bypassing as the App rather than as the admin role keeps
# humans unable to push straight to main.
#
# The job is skipped for release automation's own commits. auto commits
# the changelog as dx@cirron.com (from .autorc) and the retired
# auto_bump.sh used actions@github.com; no human commit carries either
# address, and matching author email is immune to false positives from
# commit-subject content. That commit also carries "[skip ci]", which
# suppresses push-triggered workflows on its own, so the guard is
# redundancy that does not depend on a string hardcoded in auto-core.
# PR-label skip-release is handled by auto's own logic, not here.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip release automation's own commits.
    if: >-
      github.event.head_commit.author.email != 'actions@github.com'
      && github.event.head_commit.author.email != 'dx@cirron.com'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Only actor allowed past the main publish gate.
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python deps
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install auto
        run: |
          npm install -g \
            auto \
            @auto-it/git-tag \
            @auto-it/exec \
            @auto-it/released \
            @auto-it/first-time-contributor \
            @auto-it/all-contributors

      - name: Run auto shipit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: npx auto shipit
