name: Release (rc)

# `auto next` pushes only a tag, and no ruleset covers tags, so this
# flow does not need the ruleset bypass that release.yml depends on.
# It runs as the same cirron-release App to keep one release identity
# across both branches.
#
# The job is skipped for release automation's own commits. auto commits
# as dx@cirron.com (from .autorc) and the retired auto_bump.sh used
# actions@github.com; no human commit carries either address, and
# matching author email is immune to false positives from
# commit-subject content. PR-label skip-release is handled by auto's
# own logic, not here.

on:
  push:
    branches: [rc]

permissions:
  contents: read

concurrency:
  group: release-rc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip release automation's own commits.
    if: >-
      github.event.head_commit.author.email != 'actions@github.com'
      && github.event.head_commit.author.email != 'dx@cirron.com'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Same release identity as release.yml.
      - name: Mint release-bot token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install Python deps
        run: uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x

      - name: Install auto
        run: |
          npm install -g \
            auto \
            @auto-it/git-tag \
            @auto-it/exec \
            @auto-it/released \
            @auto-it/first-time-contributor \
            @auto-it/all-contributors

      - name: Run auto next
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        # `auto next` uses the branch name as the prerelease identifier.
        # Branch is `rc`, so tags become vX.Y.Z-rc.N.
        run: npx auto next
